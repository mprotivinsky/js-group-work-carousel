<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link
    rel="stylesheet"
    href="https://cdn.jsdelivr.net/npm/swiper@12/swiper-bundle.min.css"
    />
    <link rel="stylesheet" href="style.css">
    <title>Swiper - Carousel</title>
</head>

<body>
    <main class="container">
        <div class="carousel-container">
            <div class="swiper">

                <div class="swiper-wrapper">
                    <div class="swiper-slide"><img src="images/kocka1.png" alt="Kočka č. 1"></div>
                    <div class="swiper-slide"><img src="images/kocka2.png" alt="Kočka č. 2"></div>
                    <div class="swiper-slide"><img src="images/kocka3.png" alt="Kočka č. 3"></div>
                    <div class="swiper-slide"><img src="images/kocka4.png" alt="Kočka č. 4"></div>
                </div>

                <div class="swiper-pagination"></div>

                <div class="swiper-button-prev"><img src="icons/arrow_left.svg" alt="Šipka vlevo"></div>
                <div class="swiper-button-next"><img src="icons/arrow_right.svg" alt="Šipka vlevo"></div>

                <div class="swiper-scrollbar"></div>
            </div>
        </div>

        
    </main>
    <script src="https://cdn.jsdelivr.net/npm/swiper@12/swiper-bundle.min.js"></script>
    <script src="script.js"></script>
</body>
</html>
